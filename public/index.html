<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
        <title>Ultraviolet Proxy</title>
        <link rel="shortcut icon" content="favicon.ico" />
        <link rel="stylesheet" href="index.css" />

        <!-- Ultraviolet 필수 스크립트 로드 -->
        <script src="/uv/uv.bundle.js"></script>
        <script src="/uv/uv.config.js"></script>
    </head>

    <body>
        <div>
            <div title="Ultraviolet Logo" class="flex-center logo-wrapper header-center">
                <img class="logo" src="uv.png" alt="Ultraviolet" />
                <h1>Ultraviolet | TN</h1>
            </div>
            <div class="flex-center desc left-margin">
                <p>Ultraviolet is highly sophisticated proxy used for evading internet censorship.</p>
            </div>

            <form id="uv-form" class="flex-center">
                <input id="uv-address" type="text" placeholder="Search the web freely" />
            </form>
            <div class="desc left-margin" style="text-align: center; margin-top: 10px;">
                <p id="uv-error" style="color: #ff6b6b; font-weight: bold;"></p>
            </div>
        </div>

        <footer>
            <div>
                <div>
                    <a href="https://github.com/titaniumnetwork-dev">TitaniumNetwork</a>
                    <a href="https://discord.gg/unblock">Discord</a>
                    <a href="https://github.com/tomphttp">TompHTTP</a>
                    <a href="https://github.com/titaniumnetwork-dev/Ultraviolet-App">GitHub</a>
                    <a href="credits.html">Credits</a>
                </div>
                <div>
                    <span>Ultraviolet &copy; TN 2023</span>
                </div>
            </div>
        </footer>

        <script>
            // Service Worker 등록 함수
            async function registerSW() {
                if (!("serviceWorker" in navigator)) {
                    throw new Error("이 브라우저는 Service Worker를 지원하지 않습니다.");
                }
                return await navigator.serviceWorker.register("/uv/uv.sw.js", {
                    scope: __uv$config.prefix
                });
            }

            // 페이지 로드 시 SW 등록 시도
            registerSW().catch(err => {
                console.error("SW 등록 실패:", err);
            });

            const form = document.getElementById("uv-form");
            const address = document.getElementById("uv-address");
            const errorText = document.getElementById("uv-error");

            // 폼 제출 이벤트 가로채기 (엔터 시 /? 초기화 완전 방지)
            form.addEventListener("submit", async (event) => {
                event.preventDefault(); 
                errorText.innerText = "연결 준비 중...";

                let url = address.value.trim();
                if (!url) return;

                // URL 검사 및 보정
                if (!url.startsWith("http://") && !url.startsWith("https://")) {
                    if (url.includes(".") && !url.includes(" ")) {
                        url = "https://" + url;
                    } else {
                        url = "https://www.google.com/search?q=" + encodeURIComponent(url);
                    }
                }

                try {
                    // Service Worker 활성화 대기
                    await registerSW();
                    await navigator.serviceWorker.ready;

                    // 프록시 주소로 이동
                    window.location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
                } catch (err) {
                    console.error("이동 오류:", err);
                    errorText.innerText = "연결 오류 발생: " + err.message;
                }
            });
        </script>
    </body>
</html>
